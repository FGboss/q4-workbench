name: mail-relay

# 免费发信中继：公开仓库 Actions 分钟数不限，runner 可连 QQ 邮箱 SMTP。
# 触发方式：
#   1) repository_dispatch（服务端事件：登录/新问题/测试/日报）—— 秒级发信
#   2) schedule（工作日 18:15 北京时间 = 10:15 UTC）—— 唤醒免费实例，让它补发当日日报
#   3) 手动 workflow_dispatch
#
# 仓库 Secrets 只需两个：SMTP_USER、SMTP_PASS

on:
  repository_dispatch:
    types: [send-mail]
  schedule:
    - cron: "15 10 * * 1-5"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'repository_dispatch'

      - uses: actions/setup-node@v4
        if: github.event_name == 'repository_dispatch'
        with:
          node-version: "20"

      # 只装发信需要的 nodemailer（无依赖），不装整仓 express 等依赖：
      # 避免镜像/网络波动导致 npm ci 卡住几分钟甚至超时，邮件发不出去。
      - name: 安装发信依赖（仅 nodemailer）
        if: github.event_name == 'repository_dispatch'
        timeout-minutes: 3
        run: |
          mkdir -p .relay
          cd .relay
          npm init -y > /dev/null 2>&1
          npm install nodemailer@10.1.7 --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: 发送邮件（服务端已按人算好收件人）
        if: github.event_name == 'repository_dispatch'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          PAYLOAD_B64: ${{ github.event.client_payload.b64 }}
          NODE_PATH: ${{ github.workspace }}/.relay/node_modules
        run: node mail-relay.js

      - name: 定时兜底：唤醒实例并补发当日日报
        if: github.event_name != 'repository_dispatch'
        run: |
          APP="https://q4-workbench.onrender.com"
          curl -fsS -m 90 "$APP/" > /dev/null || true
          sleep 10
          curl -fsS -m 120 "$APP/api/daily_ping" || true
