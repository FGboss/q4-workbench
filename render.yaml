# Render Blueprint —— 「一键上线」用。
# 用法：把本目录推到 GitHub 仓库，在 Render 里 New → Blueprint → 选该仓库，即自动创建下面这个 Web 服务。
services:
  - type: web
    name: q4-workbench
    runtime: node
    plan: free
    # 用 npm ci（不用 npm install）—— 这是答题系统踩过的坑：npm install 会静默卡死
    buildCommand: npm ci
    startCommand: node server.js
    # 仅当本服务由 Blueprint 创建时才生效。
    # 当前 q4-workbench 是控制台手工创建的服务，不受本文件管理，Auto-Deploy 需在控制台开启。
    autoDeploy: true
    branch: master
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "18"
      # 部署后的公网地址，如 https://q4-workbench.onrender.com（首次可先留空，拿到域名后回来补）
      - key: PUBLIC_URL
        sync: false
      # 令牌签名密钥，由 Render 自动生成随机值
      - key: APP_SECRET
        generateValue: true
      # Supabase 云库（推荐：根除免费实例休眠丢数据）。填了这两项即自动启用，未填则回退本地/GitHub。
      #   SUPABASE_URL         形如 https://xxxxxxxx.supabase.co
      #   SUPABASE_SERVICE_KEY Supabase → Project Settings → API → service_role secret（服务端用，勿外泄）
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # GitHub 持久化（三选一即可用；不配也能跑，但免费实例重启会丢数据/账号）
      - key: GH_TOKEN
        sync: false
      - key: GH_REPO
        sync: false
      - key: GH_PATH
        value: data/state.json
      - key: GH_USERS_PATH
        value: data/users.json
      - key: GH_BRANCH
        value: main
      # 邮件通知（Resend，配置 RESEND_API_KEY 即启用；不配只记录不发信）
      #   RESEND_API_KEY   Resend 控制台 → API Keys 创建
      #   MAIL_FROM        默认 onboarding@resend.dev；验证域名后可改为 workbench@novastar.tech
      #   ALERT_TO         导师/主管收件人，多个用逗号分隔
      #   DAILY_REPORT_HOUR 工作日日报时间（北京时间，默认 18）
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: "Q4 工作台 <onboarding@resend.dev>"
      - key: ALERT_TO
        value: liwf@novastar.tech
      - key: DAILY_REPORT_HOUR
        value: "18"
