# Render Blueprint —— 「一键上线」用。
# 用法：把本目录推到 GitHub 仓库，在 Render 里 New → Blueprint → 选该仓库，即自动创建下面这个 Web 服务。
services:
  - type: web
    name: q4-workbench
    runtime: node
    plan: free
    # 用 npm ci（不用 npm install）—— 这是答题系统踩过的坑：npm install 会静默卡死
    buildCommand: npm ci
    startCommand: node server.js
    # 仅当本服务由 Blueprint 创建时才生效。
    # 当前 q4-workbench 是控制台手工创建的服务，不受本文件管理，Auto-Deploy 需在控制台开启。
    autoDeploy: true
    branch: master
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "18"
      # 部署后的公网地址，如 https://q4-workbench.onrender.com（首次可先留空，拿到域名后回来补）
      - key: PUBLIC_URL
        sync: false
      # 令牌签名密钥，由 Render 自动生成随机值
      - key: APP_SECRET
        generateValue: true
      # Supabase 云库（推荐：根除免费实例休眠丢数据）。填了这两项即自动启用，未填则回退本地/GitHub。
      #   SUPABASE_URL         形如 https://xxxxxxxx.supabase.co
      #   SUPABASE_SERVICE_KEY Supabase → Project Settings → API → service_role secret（服务端用，勿外泄）
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # GitHub 持久化（三选一即可用；不配也能跑，但免费实例重启会丢数据/账号）
      - key: GH_TOKEN
        sync: false
      - key: GH_REPO
        sync: false
      - key: GH_PATH
        value: data/state.json
      - key: GH_USERS_PATH
        value: data/users.json
      - key: GH_BRANCH
        value: main
      # 邮件通知（推荐：GitHub Actions + QQ 邮箱，全免费、可按人分邮）
      #   GH_DISPATCH_TOKEN  可留空：留空时自动复用已有的 GH_TOKEN 触发发信 workflow
      #                      （若提示 token 权限不足，再单独填一个有 Actions: write 权限的 Token）
      #   GH_DISPATCH_REPO   仓库，默认 FGboss/q4-workbench
      #   RELAY_TOKEN        可留空；留空时自动复用触发用 token（需与仓库 Secrets 的 RELAY_TOKEN 一致）
      #   真正的 SMTP 账号/授权码配在 GitHub 仓库 Secrets（SMTP_USER / SMTP_PASS / RELAY_TOKEN）
      #   ALERT_TO 兜底收件人，多个用逗号分隔（领导邮箱都填这里即可，领导不用注册）
      - key: GH_DISPATCH_TOKEN
        sync: false
      - key: GH_DISPATCH_REPO
        value: FGboss/q4-workbench
      - key: RELAY_TOKEN
        sync: false
      # 以下为「免费实例直连」的旧通道（Render Free 封 SMTP 端口，一般仅付费实例可用）
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_HOST
        value: smtp.qq.com
      - key: SMTP_PORT
        value: "465"
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ALERT_TO
        value: 916941476@qq.com
      - key: DAILY_REPORT_HOUR
        value: "18"
